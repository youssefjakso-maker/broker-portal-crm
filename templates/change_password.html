{% extends "base.html" %}
{% block content %}
<a class="back" href="{{ url_for('dashboard') }}">← Back to dashboard</a>
<div class="page-head"><div><div class="eyebrow">ACCOUNT SECURITY</div><h1>Change password</h1><p class="muted">Use a unique password with at least 10 characters.</p></div></div>
<form method="post" class="card password-card">
  <label>Current password<input name="current_password" type="password" autocomplete="current-password" required></label>
  <label>New password<input name="new_password" type="password" autocomplete="new-password" minlength="10" required></label>
  <label>Confirm new password<input name="confirm_password" type="password" autocomplete="new-password" minlength="10" required></label>
  <button class="btn primary" type="submit">Update password</button>
</form>
{% endblock %}
